name: Workflow to run scripts

on: 
  push:
    branches:
      - master 

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecucion..
        run: |
          chmod +x scripts/*.sh

      - name: Ejecutar script de informacion..
        run: ./scripts/info.sh
      
      - name: Ejecutar script de deploy..
        run: ./scripts/deploy.sh

      - name: Ejecutar script message...
        run: ./scripts/message.sh
        env:
          MENSAJE: "Valor pasado desde el workflow!..."
          SEGUNDO: "otro valor"